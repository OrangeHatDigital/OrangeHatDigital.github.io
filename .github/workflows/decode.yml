name: Decode base64 assets
on:
  push:
    paths:
      - '**.b64'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode *.b64 to binary files
        run: |
          for f in $(git ls-files '*.b64'); do
            base64 -d "$f" > "${f%.b64}"
          done
      - name: Commit decoded files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Decode image assets"
          git push
